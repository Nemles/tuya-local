name: Humidifier
products:
  - id: z239up9fr3blouy3
    manufacturer: SoleusAir
    model: AHU-2000L3
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 2
        type: boolean
        name: mode
        mapping:
          - dps_val: true
            value: auto
          - dps_val: false
            value: normal
      - id: 13
        type: integer
        name: humidity
        range:
          min: 40
          max: 80
        mapping:
          - step: 5
      - id: 14
        type: integer
        name: current_humidity
      - id: 22
        type: bitfield
        name: fault
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 23
        type: string
        name: speed
        mapping:
          - dps_val: level_1
            value: 20
          - dps_val: level_2
            value: 40
          - dps_val: level_3
            value: 60
          - dps_val: level_4
            value: 80
          - dps_val: level_5
            value: 100
  - entity: switch
    translation_key: uv_sterilization
    dps:
      - id: 21
        type: boolean
        name: switch
  - entity: switch
    translation_key: ionizer
    dps:
      - id: 25
        type: boolean
        name: switch
  - entity: switch
    translation_key: electrolytic_sterilization
    dps:
      - id: 35
        type: boolean
        name: switch
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: switch
    translation_key: auto_dry
    category: config
    dps:
      - id: 26
        type: boolean
        name: switch
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
          - dps_val: "7h"
            value: "7h"
          - dps_val: "8h"
            value: "8h"
          - dps_val: "9h"
            value: "9h"
          - dps_val: "10h"
            value: "10h"
          - dps_val: "11h"
            value: "11h"
          - dps_val: "12h"
            value: "12h"
  - entity: sensor
    class: temperature
    dps:
      - id: 10
        type: integer
        name: sensor
        class: measurement
        unit: C
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        type: bitfield
        name: fault_code
      - id: 22
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: lack_water
          - dps_val: 2
            value: full_water
          - dps_val: 4
            value: coupler_fault
